name: Github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - name: "Build Github Pages"
        run: |
          mvn -B clean process-classes -Dcommand=site
          # The Fusion CLI exits 0 even when a geocoder lookup degrades, so verify the
          # expected outputs were produced before deploying (otherwise a failed run would
          # deploy an incomplete site as a green build).
          if [ ! -s target/pages/index.html ] || [ ! -s target/pages/conferences.json ] \
             || [ ! -s target/pages/api/conferences/latest.json ] \
             || [ ! -s target/pages/api/index.html ] || [ ! -s target/pages/api/openapi.js ]; then
            echo "Generation failed: target/pages was not fully written (see the output above)." >&2
            exit 1
          fi
      - name: "Deploy Github Pages"
        uses: JamesIves/github-pages-deploy-action@v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: target/pages/